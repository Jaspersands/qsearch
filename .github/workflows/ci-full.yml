name: Full test suite (nightly)

# validate.yml never runs the whole of tests/. This runs it once a night, split
# into 8 shards by pytest-split. Without a stored .test_durations file the
# shards are balanced by test count, so their run times differ.

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-tools.txt
          python -m pip install pytest-split
      - name: Shard ${{ matrix.group }} of 8
        run: python -m pytest -q tests --splits 8 --group ${{ matrix.group }}
