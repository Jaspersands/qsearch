name: Tools

# Besides the tool code, the filters name every file a tests/tools test reads from the
# checkout itself: pytest's root conftest, the CLI and every theorem and core module
# (preflight's line scan and import check, split_cli, the classical package), the CLI
# manifest, the seeded arXiv verdicts and their review, the contract preflight reports as
# broken, the referee's committed reviews with the queue and brief pages they decide, the
# notes the baseline catalog cites, the classical package's committed reports, and the
# paper's numbers with the reports behind them. A change to one of them alone runs
# this workflow on its own pull request. tests/tools/test_tools_workflow.py fails when a test
# starts reading a file these filters miss; keep push and pull_request identical.

