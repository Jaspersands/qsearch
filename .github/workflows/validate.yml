name: Validate research snapshot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile $(git ls-files '*.py')
      - name: Validate research registries
        run: python qsearch.py validate
      - name: Verify public progress snapshot
        run: |
          python tools/build_progress_snapshot.py
          git diff --exit-code research/progress_snapshot.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check website JavaScript
        run: |
          for file in site/js/*.js site/js/lib/*.js; do node --check "$file"; done
          node --test tests/js/*.test.mjs
      - name: Verify website data and references
        run: |
          python -m pip install pytest
          python -m pytest tests/test_build_site_data.py tests/test_check_site.py tests/test_build_negative_map.py -q
          python tools/build_site_data.py --skip-changelog
          git diff --exit-code site/data/activity.json site/data/negatives.json
          python -c "import json; json.load(open('site/data/changelog.json')); json.load(open('site/data/negative_map.json'))"
          python tools/check_site.py
